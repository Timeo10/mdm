services:
  back:
    build:
      context: ./back
    container_name: adv_mdm_back
    environment:
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./back:/app
      - back_node_modules:/app/node_modules
    command: npm run dev

  front:
    build:
      context: ./front
    container_name: adv_mdm_front
    depends_on:
      - back
    environment:
      VITE_API_URL: http://localhost:3000/v1
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  back_node_modules:
  front_node_modules:
